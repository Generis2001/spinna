<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>filmstrip</title>
<style>
  :root { --gl-pink:#E37DF7; --gl-purple:#9B6AF6; --gl-blue:#110FFF; --gl-violet:#7c5cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:#0b0b0d; color:#eee; font:12px/1.3 "Space Grotesk",system-ui,sans-serif; padding:16px; }
  .strip { display:flex; align-items:center; gap:2px; margin:4px 0 16px; }
  .lab { width:120px; font-size:12px; opacity:.7; text-transform:uppercase; letter-spacing:.08em; }
  .frame { width:52px; height:52px; background:#fff; display:grid; place-items:center; }
  .frame.d { background:#060606; }
  /* freeze all animations; negative delay picks the phase */
  svg *, .conicwrap { animation-play-state: paused !important; }
  .track { fill: currentColor; opacity:.16; }
  .light-fg { color:#131214; }
  .dark-fg { color:#f5f5f5; }

  .v1 .beam { animation: v1 1.6s linear infinite; }
  @keyframes v1 { from { transform: translateY(50%);} to { transform: translateY(-50%);} }
  .v1 .gem { fill: var(--gl-violet); opacity:.9; }

  .v2 .beam { animation: v2rise 1.8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes v2rise { from { transform: translateY(60%);} to { transform: translateY(-60%);} }
  .v2 .gem { fill: url(#gemGrad); animation: v2gem 1.8s ease-in-out infinite; }
  @keyframes v2gem { 0%,42%{opacity:.28;} 60%{opacity:1;} 82%,100%{opacity:.28;} }

  .v3 .conicwrap { animation: v3 1.5s linear infinite; transform-origin:50% 50%; }
  @keyframes v3 { to { transform: rotate(360deg);} }
  .v3 .gem { fill: var(--gl-violet); opacity:.9; }
</style>
</head>
<body>
<script>
const MARK = {
  left:"44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0",
  right:"53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0",
  gem:"48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92",
};
const PERIOD = { v1:1.6, v2:1.8, v3:1.5 };
function defs(id){return `<defs>
  <linearGradient id="beamGrad-${id}" x1="0" y1="1" x2="0" y2="0">
   <stop offset="0" stop-color="var(--gl-pink)" stop-opacity="0"/><stop offset=".35" stop-color="var(--gl-pink)"/>
   <stop offset=".5" stop-color="var(--gl-purple)"/><stop offset=".65" stop-color="var(--gl-blue)"/>
   <stop offset="1" stop-color="var(--gl-blue)" stop-opacity="0"/></linearGradient>
  <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gl-pink)"/><stop offset=".5" stop-color="var(--gl-purple)"/><stop offset="1" stop-color="var(--gl-blue)"/></linearGradient>
  <clipPath id="cM-${id}"><polygon points="${MARK.left}"/><polygon points="${MARK.right}"/><polygon points="${MARK.gem}"/></clipPath>
  <clipPath id="cB-${id}"><polygon points="${MARK.left}"/><polygon points="${MARK.right}"/></clipPath>
 </defs>`;}
function svg(v,id,delay){
  const S=`viewBox="0 0 97.76 91.93" width="40" height="40"`;
  const style=`style="animation-delay:${delay}s"`;
  const beamStyle=`style="animation-delay:${delay}s"`;
  const track=`<g clip-path="url(#cM-${id})"><rect class="track" width="97.76" height="91.93"/></g>`;
  if(v==='v1') return `<svg ${S}>${defs(id)}${track}<g clip-path="url(#cM-${id})"><rect class="beam" x="0" y="-91.93" width="97.76" height="183.86" fill="url(#beamGrad-${id})" ${beamStyle}/></g><polygon class="gem" points="${MARK.gem}"/></svg>`;
  if(v==='v2') return `<svg ${S}>${defs(id)}${track}<g clip-path="url(#cB-${id})"><rect class="beam" x="0" y="-91.93" width="97.76" height="183.86" fill="url(#beamGrad-${id})" ${beamStyle}/></g><polygon class="gem" points="${MARK.gem}" ${style}/></svg>`;
  if(v==='v3') return `<svg ${S}>${defs(id)}${track}<g clip-path="url(#cM-${id})"><foreignObject width="97.76" height="91.93"><div xmlns="http://www.w3.org/1999/xhtml" class="conicwrap" ${beamStyle} style="width:97.76px;height:91.93px;animation-delay:${delay}s;background:conic-gradient(from 0deg, transparent 0deg 210deg, var(--gl-blue) 265deg, var(--gl-purple) 320deg, var(--gl-pink) 352deg, transparent 360deg)"></div></foreignObject></g><polygon class="gem" points="${MARK.gem}"/></svg>`;
}
const N=9; // 0..8 phases; frame 8 == frame 0 next loop (seamless check)
let html='';
for (const v of ['v1','v2','v3']) {
  for (const [mode,fg] of [['light','light-fg'],['dark','dark-fg']]) {
    html += `<div class="strip ${v} ${fg}"><div class="lab">${v} ${mode}</div>`;
    for (let i=0;i<N;i++){
      const delay = -(i/(N-1))*PERIOD[v]; // -0 .. -period
      html += `<div class="frame ${mode==='dark'?'d':''}">${svg(v, v+mode+i, delay)}</div>`;
    }
    html += `</div>`;
  }
}
document.body.innerHTML = html;
</script>
</body>
</html>
