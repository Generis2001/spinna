<?xml version="1.0" encoding="UTF-8"?>
<!--
  GenLayer Spinner — built on the official GenLayer mark (mark coords 0 0 97.76 91.93).
  Self-contained animated SVG. A bright brand-gradient band sweeps upward through
  the mark while the whole mark slowly rotates — a seamless infinite loop. Works on
  light and dark backgrounds, readable at small sizes. No JS, no external assets.

  Usage:  <img src="genlayer-spinner.svg" width="48" height="48" alt="Loading">
-->
<!-- viewBox is a 200x200 square centered on the mark centroid (48.88, 45.965).
     The mark's farthest corner is ~67px from center; 100px half-side gives
     33px of clearance all around — corners never clip regardless of rotation. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.12 -54.035 200 200"
     width="48" height="48" role="img" aria-label="Loading" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Traveling brand band over a dim base. Pattern is periodic over 1/3 of the
         3x-tall rect, so a translate of exactly 1/3 loops seamlessly. Strong
         luminance swing (dark blue -> light pink) makes the motion clearly visible. -->
    <linearGradient id="gl-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.000" stop-color="#110FFF" stop-opacity="0.25"/>
      <stop offset="0.070" stop-color="#110FFF"/>
      <stop offset="0.140" stop-color="#9B6AF6"/>
      <stop offset="0.200" stop-color="#E37DF7"/>
      <stop offset="0.270" stop-color="#9B6AF6" stop-opacity="0.35"/>
      <stop offset="0.333" stop-color="#110FFF" stop-opacity="0.25"/>
      <stop offset="0.403" stop-color="#110FFF"/>
      <stop offset="0.473" stop-color="#9B6AF6"/>
      <stop offset="0.533" stop-color="#E37DF7"/>
      <stop offset="0.603" stop-color="#9B6AF6" stop-opacity="0.35"/>
      <stop offset="0.666" stop-color="#110FFF" stop-opacity="0.25"/>
      <stop offset="0.736" stop-color="#110FFF"/>
      <stop offset="0.806" stop-color="#9B6AF6"/>
      <stop offset="0.866" stop-color="#E37DF7"/>
      <stop offset="0.936" stop-color="#9B6AF6" stop-opacity="0.35"/>
      <stop offset="1.000" stop-color="#110FFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gl-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E37DF7"/>
      <stop offset="0.5" stop-color="#9B6AF6"/>
      <stop offset="1" stop-color="#110FFF"/>
    </linearGradient>
    <clipPath id="gl-blades">
      <polygon points="44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0"/>
      <polygon points="53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0"/>
    </clipPath>
  </defs>

  <style>
    .gl-track { fill: #131214; opacity: 0.12; }
    @media (prefers-color-scheme: dark) { .gl-track { fill: #f5f5f5; opacity: 0.14; } }
    .gl-beam { animation: gl-flow 1.3s linear infinite; will-change: transform; }
    @keyframes gl-flow {
      from { transform: translateY(0); }
      to   { transform: translateY(-30.643px); } /* 91.93 / 3 == one gradient period */
    }
    .gl-gem { fill: url(#gl-gem); animation: gl-gem 1.3s ease-in-out infinite; }
    @keyframes gl-gem { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    /* Slow rotation of the whole mark — corners clear the viewport at all angles. */
    .gl-rotate { animation: gl-spin 4s linear infinite; transform-origin: 48.88px 45.965px; transform-box: view-box; }
    @keyframes gl-spin { to { transform: rotate(360deg); } }
  </style>

  <g class="gl-rotate">
    <!-- resting mark -->
    <g clip-path="url(#gl-blades)"><rect class="gl-track" width="97.76" height="91.93"/></g>
    <!-- flowing brand band, clipped to the blades (3x tall, starts one viewBox above) -->
    <g clip-path="url(#gl-blades)">
      <rect class="gl-beam" x="0" y="-91.93" width="97.76" height="275.79" fill="url(#gl-beam)"/>
    </g>
    <!-- center gem -->
    <polygon class="gl-gem" points="48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92"/>
  </g>
</svg>
