<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>refine</title>
<style>
  :root { --gl-pink:#E37DF7; --gl-purple:#9B6AF6; --gl-blue:#110FFF; --gl-violet:#7c5cff; }
  *{box-sizing:border-box;}
  body{margin:0;font:12px/1.3 "Space Grotesk",system-ui,sans-serif;}
  .theme{padding:22px 22px 26px;}
  .light{background:#fff;color:#131214;} .dark{background:#060606;color:#f5f5f5;}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin:0 0 14px;font-weight:600;}
  .row{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-end;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .sizes{display:flex;gap:16px;align-items:flex-end;}
  .cap{font-size:10px;opacity:.55;}
  .track{fill:currentColor;opacity:.16;}

  /* A1 — solid continuous brand flow (never empties) */
  .a1 .beam{animation:flow 1.6s linear infinite;}
  .a1 .gem{fill:url(#g);opacity:.95;}
  /* A2 — rising pulses through blades + synced gem consensus */
  .a2 .beam{animation:flow 1.7s linear infinite;}
  .a2 .gem{fill:url(#g);animation:gem 1.7s ease-in-out infinite;}
  /* A3 — dual offset (coordination) */
  .a3 .beamL{animation:flow 1.7s linear infinite;}
  .a3 .beamR{animation:flow 1.7s linear infinite;animation-delay:-.85s;}
  .a3 .gem{fill:url(#g);animation:gem 1.7s ease-in-out infinite;}

  @keyframes flow{from{transform:translateY(0);}to{transform:translateY(-33.333%);}}
  @keyframes gem{0%,100%{opacity:.35;}50%{opacity:1;}}
</style>
</head>
<body>
<script>
const M={left:"44.26 32.35 27.72 67.12 43.29 74.9 0 91.93 44.26 0",right:"53.5 32.35 70.04 67.12 54.47 74.9 97.76 91.93 53.5 0",gem:"48.64 43.78 58.33 62.94 48.64 67.69 39.47 62.92"};
// tall repeating beam rect: height = 3x viewbox, gradient repeats every 1/3 -> translate -1/3 seamless
function defs(id,style){
  // 'solid' = full-color repeating; 'pulse' = colored bands with transparent gaps
  const solid = `
    <stop offset="0" stop-color="var(--gl-blue)"/>
    <stop offset=".166" stop-color="var(--gl-purple)"/>
    <stop offset=".333" stop-color="var(--gl-pink)"/>
    <stop offset=".5" stop-color="var(--gl-purple)"/>
    <stop offset=".666" stop-color="var(--gl-blue)"/>
    <stop offset=".833" stop-color="var(--gl-purple)"/>
    <stop offset="1" stop-color="var(--gl-pink)"/>`;
  const pulse = `
    <stop offset="0" stop-color="var(--gl-pink)" stop-opacity="0"/>
    <stop offset=".08" stop-color="var(--gl-pink)"/>
    <stop offset=".16" stop-color="var(--gl-purple)"/>
    <stop offset=".24" stop-color="var(--gl-blue)"/>
    <stop offset=".32" stop-color="var(--gl-blue)" stop-opacity="0"/>
    <stop offset=".41" stop-color="var(--gl-pink)" stop-opacity="0"/>
    <stop offset=".49" stop-color="var(--gl-pink)"/>
    <stop offset=".57" stop-color="var(--gl-purple)"/>
    <stop offset=".65" stop-color="var(--gl-blue)"/>
    <stop offset=".73" stop-color="var(--gl-blue)" stop-opacity="0"/>
    <stop offset=".74" stop-color="var(--gl-pink)" stop-opacity="0"/>
    <stop offset=".82" stop-color="var(--gl-pink)"/>
    <stop offset=".90" stop-color="var(--gl-purple)"/>
    <stop offset=".98" stop-color="var(--gl-blue)"/>
    <stop offset="1" stop-color="var(--gl-blue)" stop-opacity="0"/>`;
  return `<defs>
    <linearGradient id="beam-${id}" x1="0" y1="0" x2="0" y2="1">${style==='solid'?solid:pulse}</linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gl-pink)"/><stop offset=".5" stop-color="var(--gl-purple)"/><stop offset="1" stop-color="var(--gl-blue)"/></linearGradient>
    <clipPath id="cM-${id}"><polygon points="${M.left}"/><polygon points="${M.right}"/><polygon points="${M.gem}"/></clipPath>
    <clipPath id="cB-${id}"><polygon points="${M.left}"/><polygon points="${M.right}"/></clipPath>
  </defs>`;
}
// beam rect spans y=-91.93..183.86 (3x), gradient objectBoundingBox repeats across it
function svg(kind,id,sz){
  const S=`viewBox="0 0 97.76 91.93" width="${sz}" height="${sz}"`;
  const bh=91.93*3, by=-91.93;
  const track=`<g clip-path="url(#cM-${id})"><rect class="track" width="97.76" height="91.93"/></g>`;
  if(kind==='a1') return `<svg ${S}>${defs(id,'solid')}${track}<g clip-path="url(#cM-${id})"><rect class="beam" x="0" y="${by}" width="97.76" height="${bh}" fill="url(#beam-${id})"/></g><polygon class="gem" points="${M.gem}"/></svg>`;
  if(kind==='a2') return `<svg ${S}>${defs(id,'pulse')}${track}<g clip-path="url(#cB-${id})"><rect class="beam" x="0" y="${by}" width="97.76" height="${bh}" fill="url(#beam-${id})"/></g><polygon class="gem" points="${M.gem}"/></svg>`;
  if(kind==='a3') return `<svg ${S}>${defs(id,'pulse')}${track}<g clip-path="url(#cB-${id})"><rect class="beamL" x="0" y="${by}" width="48.88" height="${bh}" fill="url(#beam-${id})"/><rect class="beamR" x="48.88" y="${by}" width="48.88" height="${bh}" fill="url(#beam-${id})"/></g><polygon class="gem" points="${M.gem}"/></svg>`;
}
const kinds=[['a1','A1 · continuous flow'],['a2','A2 · consensus pulse'],['a3','A3 · dual offset']];
function bigrow(cls){let h=`<div class="row">`;kinds.forEach(([k,l],i)=>{h+=`<div class="cell ${k}">${svg(k,cls+k+i,64)}<div class="cap">${l}</div></div>`;});return h+`</div>`;}
function smallrow(cls){let h=`<div class="row" style="margin-top:22px">`;kinds.forEach(([k,l],i)=>{h+=`<div class="cell ${k}"><div class="sizes">${[16,20,24,32].map((s,j)=>svg(k,cls+k+i+'s'+j,s)).join('')}</div><div class="cap">${l} · 16/20/24/32</div></div>`;});return h+`</div>`;}
function theme(cls,title){return `<section class="theme ${cls}"><h2>${title}</h2>${bigrow(cls)}${smallrow(cls)}</section>`;}
document.body.innerHTML = theme('light','Light') + theme('dark','Dark');
</script>
</body>
</html>
