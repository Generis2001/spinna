<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenLayer Spinner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  /* GenLayer identity — inscribed top-left of the page */
  .wordmark{
    position:fixed;top:20px;left:24px;z-index:10;
    font:700 18px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.01em;
    background:linear-gradient(135deg,#E37DF7 0%,#9B6AF6 45%,#110FFF 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stage{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;}
  @media (max-width:700px){.stage{grid-template-columns:1fr;}}
  .panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:40px;}
  .light{background:#ffffff;}
  .dark{background:#060606;}
  .hero{width:120px;height:120px;}
  .sizes{display:flex;align-items:flex-end;gap:26px;}
  .sizes img{display:block;}
</style>
</head>
<body>
  <div class="wordmark">GenLayer</div>
  <div class="stage">
    <section class="panel light">
      <img class="hero" src="../src/lib/genlayer-spinner.svg" alt="Loading">
      <div class="sizes">
        <img src="../src/lib/genlayer-spinner.svg" width="16" height="16" alt="">
        <img src="../src/lib/genlayer-spinner.svg" width="24" height="24" alt="">
        <img src="../src/lib/genlayer-spinner.svg" width="32" height="32" alt="">
        <img src="../src/lib/genlayer-spinner.svg" width="48" height="48" alt="">
      </div>
    </section>
    <section class="panel dark">
      <img class="hero" src="../src/lib/genlayer-spinner.svg" alt="Loading">
      <div class="sizes">
        <img src="../src/lib/genlayer-spinner.svg" width="16" height="16" alt="">
        <img src="../src/lib/genlayer-spinner.svg" width="24" height="24" alt="">
        <img src="../src/lib/genlayer-spinner.svg" width="32" height="32" alt="">
        <img src="../src/lib/genlayer-spinner.svg" width="48" height="48" alt="">
      </div>
    </section>
  </div>
</body>
</html>
